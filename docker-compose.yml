version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: quiz-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=quiz_battle
    networks:
      - quiz-network

  # Backend (Python FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quiz-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=quiz_battle
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key}
      - AI_SERVICE_URL=http://ai-service:8001
    networks:
      - quiz-network
    volumes:
      - ./backend:/app
    command: python main.py

  # AI Service (Python FastAPI + RAG)
  ai-service:
    build:
      context: ./backend/ai-service
      dockerfile: Dockerfile
    container_name: quiz-ai-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - quiz-network
    volumes:
      - ./backend/ai-service:/app
      - ai_uploads:/app/uploads
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  # Frontend (React + Vite) - for development
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quiz-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - quiz-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  mongodb_data:
    driver: local
  ai_uploads:
    driver: local

networks:
  quiz-network:
    driver: bridge
